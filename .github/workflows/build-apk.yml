name: Build Android APK (v1.5.5-test)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK & NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build Translator CLI
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release

      - name: Fetch prebuilt libSDL3.so
        run: |
          mkdir -p packaging/android/libs/arm64-v8a
          curl -L -s -o base_v1.5.apk https://github.com/Kiridor123/OceanTriRecomp-Android/releases/download/v1.5/OceanTriRecomp-Android-v1.5-arm64.apk
          unzip -p base_v1.5.apk lib/arm64-v8a/libSDL3.so > packaging/android/libs/arm64-v8a/libSDL3.so
          rm -f base_v1.5.apk

      - name: Build OpenSSL for Android ARM64
        run: |
          git clone --depth 1 -b openssl-3.0.15 https://github.com/openssl/openssl.git $RUNNER_TEMP/openssl-src
          cd $RUNNER_TEMP/openssl-src
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix=$RUNNER_TEMP/openssl-android
          make -j$(nproc)
          make install_sw
          if [ -d "$RUNNER_TEMP/openssl-android/lib64" ] && [ ! -d "$RUNNER_TEMP/openssl-android/lib" ]; then
            ln -s lib64 "$RUNNER_TEMP/openssl-android/lib"
          fi
          echo "OPENSSL_ANDROID_DIR=$RUNNER_TEMP/openssl-android" >> $GITHUB_ENV

      - name: Compile Native Libraries and Package APK
        run: |
          chmod +x scripts/build-android.sh packaging/android/build_apk.sh
          bash scripts/build-android.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5.5-cheats-arm64
          path: release/*.apk
          if-no-files-found: error

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.5-cheats-r3
          name: "OceanTriRecomp Android v1.5.5-r3 (16KB Page Alignment & Android 15/PixelOS Fix)"
          body: |
            ## OceanTriRecomp Android v1.5.5-r3 (PixelOS / Android 15 Fix) 🦖📱⚡

            Rilis pembaruan khusus untuk menangani kompatibilitas **Android 15+ / PixelOS (Snapdragon 7s Gen 2 / POCO X6 5G)** dan arsitektur 16KB Page Alignment:

            ### 🚀 Perbaikan Utama pada Rilis Ini:
            1. **16KB Page Alignment Native Libraries (`jar -0`)**:
               - Pustaka native (`libmain.so`, `libSDL3.so`, `libpng16.so`) kini dikemas ke APK secara **uncompressed (`compress_type=0`)**.
               - Ini memungkinkan `zipalign -P 16 -f 4` menyelaraskan offset biner tepat pada kelipatan 16.384 byte (16KB), memenuhi standar ketat dynamic linker Android 15/PixelOS.
            2. **Target SDK Safe Alignment (`targetSdkVersion="34"`)**:
               - Menyelaraskan target SDK ke Android 14 guna menghindari sandbox sandbox trap agresif pada Android 15 kustom ROM.
            3. **Safe Dialog & Crash Protection**:
               - Dialog kesalahan SDL kini aman dari `WindowManager.BadTokenException`.
               - Logging status pemuatan library `.so` secara real-time.

            ### 🎮 Fitur Mod & Cheats:
            - **Tab Cheats di Menu Pengaturan (⚙ Settings ➔ Cheats)**: God Mode, Infinite Stamina, Infinite Oxygen, Max Sharpness, Infinite Ammo, Status Immunity.
            - **Dukungan Penuh Gamepad**: GameSir Nova Lite / Xbox / Switch layout.
          files: release/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
