name: Build Android APK (v1.5.5-test)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK & NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build Translator CLI
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release

      - name: Fetch prebuilt libSDL3.so
        run: |
          mkdir -p packaging/android/libs/arm64-v8a
          curl -L -s -o base_v1.5.apk https://github.com/Kiridor123/OceanTriRecomp-Android/releases/download/v1.5/OceanTriRecomp-Android-v1.5-arm64.apk
          unzip -p base_v1.5.apk lib/arm64-v8a/libSDL3.so > packaging/android/libs/arm64-v8a/libSDL3.so
          rm -f base_v1.5.apk

      - name: Build OpenSSL for Android ARM64
        run: |
          git clone --depth 1 -b openssl-3.0.15 https://github.com/openssl/openssl.git $RUNNER_TEMP/openssl-src
          cd $RUNNER_TEMP/openssl-src
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix=$RUNNER_TEMP/openssl-android
          make -j$(nproc)
          make install_sw
          if [ -d "$RUNNER_TEMP/openssl-android/lib64" ] && [ ! -d "$RUNNER_TEMP/openssl-android/lib" ]; then
            ln -s lib64 "$RUNNER_TEMP/openssl-android/lib"
          fi
          echo "OPENSSL_ANDROID_DIR=$RUNNER_TEMP/openssl-android" >> $GITHUB_ENV

      - name: Compile Native Libraries and Package APK
        run: |
          chmod +x scripts/build-android.sh packaging/android/build_apk.sh
          bash scripts/build-android.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5.5-cheats-arm64
          path: release/*.apk
          if-no-files-found: error

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.5-cheats
          name: "OceanTriRecomp Android v1.5.5 (Cheats Overlay Mod)"
          body: |
            ## OceanTriRecomp Android v1.5.5 (Custom Cheats Mod) 🦖🎮📱

            Versi kustom Monster Hunter Tri Android ARM64 dengan integrasi menu overlay aktivasi cheat on/off langsung di layar sentuh serta kompatibilitas Gamepad (GameSir Nova Lite).

            ### ✨ Fitur Baru yang Ditambahkan:
            - **Tab Cheats Baru di Menu Pengaturan (⚙ Settings ➔ Cheats)**:
              - 🛡️ **God Mode / No Damage**: Kebal dari semua serangan monster, lava, racun, dan damage lingkungan.
              - ⚡ **Infinite Stamina**: Lari, roll/dodge, dan manuver tanpa pernah kehabisan stamina.
              - 🤿 **Infinite Oxygen**: Oksigen bawah air terkunci di angka 100% (bebas berenang dan berburu di air).
              - ⚔️ **Max Sharpness**: Ketajaman senjata melee selalu maksimal dan tidak pernah tumpul.
              - 🏹 **Infinite Ammo**: Peluru bowgun tidak berkurang saat ditembakkan.
              - 🧪 **Status Immunity**: Kebal dari racun, lumpur Barroth, dan salju.
            - **🎮 Dukungan Penuh Gamepad**: Plug-and-play GameSir Nova Lite / Xbox / Nintendo Switch gamepad dengan analog Hall Effect.
            - **🔒 Auto Safe-Guard**: Cheat otomatis nonaktif saat beralih ke server online Loc Lac.
            - **💾 Persistence**: Status toggle switch disimpan otomatis di `/storage/emulated/0/MH3/MH3UI.cheats`.
          files: release/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
