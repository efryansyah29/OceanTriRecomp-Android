name: Build Monster Hunter Tri Modded APK (v1.5-cheats)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp v1.5 Cheats Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Official v1.5 Base APK
        run: |
          mkdir -p build/base
          curl -L -s -o build/v1.5.apk https://github.com/Kiridor123/OceanTriRecomp-Android/releases/download/v1.5/OceanTriRecomp-Android-v1.5-arm64.apk
          unzip -q build/v1.5.apk -d build/base
          rm -rf build/base/META-INF

      - name: Compile Modified Java Classes
        run: |
          mkdir -p build/classes build/dex
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)
          echo "Using Android Jar: $ANDROID_JAR"
          
          javac -encoding UTF-8 -cp "$ANDROID_JAR" -d build/classes \
            packaging/android/src/org/libsdl/app/*.java \
            packaging/android/src/com/oceantri/mh3/*.java

          D8_CMD=$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -n 1)
          echo "Using d8: $D8_CMD"
          CLASS_FILES=$(find build/classes -name "*.class")
          "$D8_CMD" --min-api 29 --output build/dex $CLASS_FILES
          
          cp build/dex/classes.dex build/base/classes.dex

      - name: Repackage and Sign APK
        run: |
          ZIPALIGN_CMD=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER_CMD=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using zipalign: $ZIPALIGN_CMD"
          echo "Using apksigner: $APKSIGNER_CMD"
          
          cd build/base
          zip -q -r ../unaligned.apk .
          cd ../..
          
          "$ZIPALIGN_CMD" -f 4 build/unaligned.apk build/aligned.apk
          
          keytool -genkey -v -keystore build/keystore.jks -alias oceantri -keyalg RSA -keysize 2048 -validity 10000 -storepass oceantri123 -keypass oceantri123 -dname "CN=OceanTri, OU=MH3, O=Recomp, L=LocLac, S=Moga, C=JP"
          
          mkdir -p release
          "$APKSIGNER_CMD" sign --ks build/keystore.jks --ks-pass pass:oceantri123 --key-pass pass:oceantri123 --out release/OceanTriRecomp-Android-v1.5-cheats.apk build/aligned.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5-cheats
          path: release/*.apk
          if-no-files-found: error

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5-cheats-final
          name: "OceanTriRecomp Android v1.5 Cheats Mod (Zero-Crash Official Engine)"
          body: |
            ## 🎮 Monster Hunter Tri Android v1.5 - Cheats Mod (Official Engine Zero-Crash) 🦖📱⚡
            
            Versi modifikasi ini dibangun di atas **100% pustaka mesin resmi v1.5** yang terbukti mulus tanpa force-close di **Android 17 / PixelOS POCO X6 5G**.
            
            ### 🛡️ Fitur Cheats:
            - **God Mode (No Damage)**: Hunter kebal terhadap segala serangan monster.
            - **Infinite Stamina**: Stamina hunter penuh terus tanpa batas saat lari, menghindar, atau menyerang.
            - **Infinite Air (Oxygen)**: Nafas saat menyelam / berenang tidak pernah habis.
            - **Infinite Items**: Potion, Whetstone, Ration, Trap tidak pernah berkurang dari pouch saat dipakai.
            - **Infinite Zenny**: Uang langsung 9.999.999z.
            - **Infinite Ammo**: Peluru Bowgun tidak berkurang dari pouch.
            
            ### 📝 Cara Penggunaan:
            1. Pasang APK `OceanTriRecomp-Android-v1.5-cheats.apk`.
            2. Buka aplikasi, izinkan akses penyimpanan (Storage Permission).
            3. Menu Cheats interaktif akan muncul di layar — centang cheat yang ingin Anda aktifkan, lalu tekan **MULAI MAIN (START)**.
            4. Pengaturan cheat juga otomatis tersimpan di `/storage/emulated/0/MH3/cheats.txt`.
          files: release/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
