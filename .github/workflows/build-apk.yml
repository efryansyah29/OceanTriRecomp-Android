name: Build Android APK (v1.5.5-test)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK & NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build Translator CLI
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release

      - name: Fetch prebuilt libSDL3.so
        run: |
          mkdir -p packaging/android/libs/arm64-v8a
          curl -L -s -o base_v1.5.apk https://github.com/Kiridor123/OceanTriRecomp-Android/releases/download/v1.5/OceanTriRecomp-Android-v1.5-arm64.apk
          unzip -p base_v1.5.apk lib/arm64-v8a/libSDL3.so > packaging/android/libs/arm64-v8a/libSDL3.so
          rm -f base_v1.5.apk

      - name: Build OpenSSL for Android ARM64
        run: |
          git clone --depth 1 -b openssl-3.0.15 https://github.com/openssl/openssl.git $RUNNER_TEMP/openssl-src
          cd $RUNNER_TEMP/openssl-src
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix=$RUNNER_TEMP/openssl-android
          make -j$(nproc)
          make install_sw
          if [ -d "$RUNNER_TEMP/openssl-android/lib64" ] && [ ! -d "$RUNNER_TEMP/openssl-android/lib" ]; then
            ln -s lib64 "$RUNNER_TEMP/openssl-android/lib"
          fi
          echo "OPENSSL_ANDROID_DIR=$RUNNER_TEMP/openssl-android" >> $GITHUB_ENV

      - name: Compile Native Libraries and Package APK
        run: |
          chmod +x scripts/build-android.sh packaging/android/build_apk.sh
          bash scripts/build-android.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5.5-cheats-arm64
          path: release/*.apk
          if-no-files-found: error

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.5-cheats-r2
          name: "OceanTriRecomp Android v1.5.5-r2 (Cheats Mod & Cold-Start Crash Fix)"
          body: |
            ## OceanTriRecomp Android v1.5.5-r2 (Cheats Mod + Crash Fix) 🦖🎮📱

            Pembaruan kustom Monster Hunter Tri Android ARM64 dengan integrasi menu overlay aktivasi cheat on/off, kompatibilitas Gamepad (GameSir Nova Lite), serta **perbaikan fatal crash saat startup**.

            ### 🐛 Perbaikan Fatal Crash pada Rilis Ini:
            - **Fixed Cold-Start WindowManager BadTokenException**: Memperbaiki urutan `super.onCreate()` dan menunda pemanggilan dialog seleksi ROM ke `onResume()` sehingga aplikasi tidak force close seketika saat baru dibuka ketika file ROM belum ada.
            - **Safe Dialog Handlers**: Mencegah crash jika dialog muncul saat aplikasi belum terpasang ke window manager.
            - **Bilingual Prompts**: Dialog informasi pemilihan ROM kini lebih jelas.

            ### ✨ Fitur Cheat & Controller:
            - **Tab Cheats di Menu Pengaturan (⚙ Settings ➔ Cheats)**:
              - 🛡️ **God Mode / No Damage**: Kebal dari semua serangan monster, lava, dan racun.
              - ⚡ **Infinite Stamina**: Lari dan roll tanpa batas.
              - 🤿 **Infinite Oxygen**: Nafas selam terkunci di 100%.
              - ⚔️ **Max Sharpness**: Ketajaman senjata melee selalu maksimal.
              - 🏹 **Infinite Ammo**: Peluru bowgun tidak berkurang.
              - 🧪 **Status Immunity**: Kebal racun, lumpur, dan salju.
            - **🎮 Dukungan Penuh Gamepad**: Plug-and-play GameSir Nova Lite / Xbox / Nintendo Switch gamepad.
            - **🔒 Auto Safe-Guard & Persistence**: Konfigurasi otomatis disimpan dan otomatis nonaktif di server online.
          files: release/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
